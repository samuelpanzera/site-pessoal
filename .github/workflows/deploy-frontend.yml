name: Build & Deploy Frontend

on:
  workflow_dispatch: {}
  push:
    branches: [master, 'fix/**', 'feat/**']
    paths:
      - apps/frontend/**
      - .github/workflows/deploy-frontend.yml

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Set build date
        id: date
        run: echo "date=$(date +'%b %d, %Y' | tr '[:lower:]' '[:upper:]')" >> $GITHUB_OUTPUT

      - name: Build frontend
        env:
          VITE_LAST_UPDATED: ${{ steps.date.outputs.date }}
        run: bunx turbo build --filter=frontend

      - name: Upload build to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: apps/frontend/dist/*
          target: /tmp/portfolio-dist/
          strip_components: 3
          overwrite: true

      - name: Deploy to web root
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo mkdir -p /var/www/portfolio
            sudo rm -rf /var/www/portfolio/*
            sudo cp -rT /tmp/portfolio-dist/ /var/www/portfolio/
            sudo systemctl reload nginx
            sudo rm -rf /tmp/portfolio-dist/
