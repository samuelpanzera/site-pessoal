<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="primary-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ddb7ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4b0082" stop-opacity="0.9" />
    </linearGradient>

    <!-- Paths for data flow -->
    <path id="path1" d="M 150 200 Q 400 50 400 300" fill="none" />
    <path id="path2" d="M 650 200 Q 400 50 400 300" fill="none" />
    <path id="path3" d="M 150 400 Q 400 550 400 300" fill="none" />
    <path id="path4" d="M 650 400 Q 400 550 400 300" fill="none" />
    <path id="path5" d="M 150 300 L 400 300" fill="none" />
    <path id="path6" d="M 650 300 L 400 300" fill="none" />
  </defs>

  <!-- Connectors -->
  <g stroke="#4b0082" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="8 8">
    <use href="#path1" />
    <use href="#path2" />
    <use href="#path3" />
    <use href="#path4" />
    <use href="#path5" />
    <use href="#path6" />
    <path d="M 150 200 L 150 400 M 650 200 L 650 400" />
    
    <!-- Animating dashed lines -->
    <animate attributeName="stroke-dashoffset" from="16" to="0" dur="2s" repeatCount="indefinite" />
  </g>

  <!-- Central Hub (Server) -->
  <g transform="translate(400, 300)" filter="url(#glow)">
    <circle r="40" fill="none" stroke="#ddb7ff" stroke-width="2">
      <animate attributeName="r" values="40;45;40" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.6;1" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle r="55" fill="none" stroke="#7b41b3" stroke-width="1" stroke-dasharray="4 4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite" />
    </circle>
    <rect x="-25" y="-25" width="50" height="50" rx="8" fill="url(#primary-gradient)" />
    <!-- Core pulse -->
    <rect x="-15" y="-15" width="30" height="30" rx="4" fill="#ffffff" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Node configurations -->
  <!-- Database Node Top Left -->
  <g transform="translate(150, 200)" filter="url(#subtle-glow)">
    <rect x="-30" y="-25" width="60" height="50" rx="4" fill="#1C243A" stroke="#4b0082" stroke-width="2" />
    <line x1="-30" y1="-5" x2="30" y2="-5" stroke="#4b0082" stroke-width="1" />
    <line x1="-30" y1="10" x2="30" y2="10" stroke="#4b0082" stroke-width="1" />
    <circle cx="0" cy="0" r="4" fill="#ddb7ff">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="0.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Service Node Bottom Left -->
  <g transform="translate(150, 400)" filter="url(#subtle-glow)">
    <polygon points="0,-25 25,0 0,25 -25,0" fill="#1C243A" stroke="#4b0082" stroke-width="2" />
    <circle cx="0" cy="0" r="4" fill="#ddb7ff">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="1s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Service Node Top Right -->
  <g transform="translate(650, 200)" filter="url(#subtle-glow)">
    <polygon points="0,-25 25,0 0,25 -25,0" fill="#1C243A" stroke="#4b0082" stroke-width="2" />
    <circle cx="0" cy="0" r="4" fill="#ddb7ff">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="0.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Database Node Bottom Right -->
  <g transform="translate(650, 400)" filter="url(#subtle-glow)">
    <rect x="-30" y="-25" width="60" height="50" rx="4" fill="#1C243A" stroke="#4b0082" stroke-width="2" />
    <line x1="-30" y1="-5" x2="30" y2="-5" stroke="#4b0082" stroke-width="1" />
    <line x1="-30" y1="10" x2="30" y2="10" stroke="#4b0082" stroke-width="1" />
    <circle cx="0" cy="0" r="4" fill="#ddb7ff">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" begin="0.8s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- Middle Left Node -->
  <g transform="translate(150, 300)" filter="url(#subtle-glow)">
    <rect x="-20" y="-20" width="40" height="40" rx="20" fill="#1C243A" stroke="#4b0082" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#ddb7ff" />
  </g>

  <!-- Middle Right Node -->
  <g transform="translate(650, 300)" filter="url(#subtle-glow)">
    <rect x="-20" y="-20" width="40" height="40" rx="20" fill="#1C243A" stroke="#4b0082" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#ddb7ff" />
  </g>

  <!-- Data Packets (Animating dots along paths) -->
  <circle r="4" fill="#ddb7ff" filter="url(#glow)">
    <animateMotion dur="3s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1">
      <mpath href="#path1" />
    </animateMotion>
  </circle>
  <circle r="4" fill="#ddb7ff" filter="url(#glow)">
    <animateMotion dur="4s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1">
      <mpath href="#path2" />
    </animateMotion>
  </circle>
  <circle r="4" fill="#fff" filter="url(#glow)">
    <animateMotion dur="2.5s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1">
      <mpath href="#path3" />
    </animateMotion>
  </circle>
  <circle r="4" fill="#fff" filter="url(#glow)">
    <animateMotion dur="3.5s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1">
      <mpath href="#path4" />
    </animateMotion>
  </circle>
  <circle r="3" fill="#ddb7ff" filter="url(#glow)">
    <animateMotion dur="2s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1">
      <mpath href="#path5" />
    </animateMotion>
  </circle>
  <circle r="3" fill="#ddb7ff" filter="url(#glow)">
    <animateMotion dur="2s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1">
      <mpath href="#path6" />
    </animateMotion>
  </circle>
</svg>
