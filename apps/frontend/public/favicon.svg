<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <filter id="glow-s" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-border" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#121414"/>

  <!-- Purple border glow -->
  <rect width="32" height="32" rx="6" fill="none"
        stroke="#4b0082" stroke-width="1.5"
        filter="url(#glow-border)" opacity="0.9"/>

  <!-- "S" letter -->
  <text x="16" y="22.5"
        font-family="Space Grotesk, system-ui, sans-serif"
        font-size="21"
        font-weight="700"
        text-anchor="middle"
        fill="#ddb7ff"
        filter="url(#glow-s)">S</text>
</svg>
